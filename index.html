<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026年教会退修会｜报名登记</title>
<style>
body{margin:0;background:#f5f3ed;color:#292b27;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 15px 50px}.hero{background:linear-gradient(145deg,#52684d,#83937a);color:#fff;border-radius:22px;padding:30px 22px}
.hero h1{font-size:27px;margin:12px 0 4px}.card{background:#fff;border-radius:17px;padding:21px 18px;margin:14px 0;box-shadow:0 4px 18px #00000008}
h2{font-size:18px}.title{display:block;font-weight:700;margin:14px 0 7px}.required{color:#a65353}
input[type=text]{width:100%;padding:11px 1px;border:1px solid #dddcd4;border-radius:10px;font-size:15px}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.option{position:relative}.option input{position:absolute;opacity:0}
.option span{display:block;border:1px solid #dddcd4;border-radius:10px;padding:9px;text-align:center;cursor:pointer}
.option input:checked+span{background:#edf2ea;border-color:#5b6f55;font-weight:700}
.people{border:1px solid #dddcd4;background:#fafaf7;border-radius:13px;padding:15px;margin:11px 0}
.people-head{display:flex;justify-content:space-between}.remove{border:0;background:none;color:#a65353}.add,.btn{width:100%;padding:13px;border-radius:11px;font-size:16px}
.add{border:1px dashed #5b6f55;background:#f8faf6;color:#43543f}.btn{border:0;background:#5b6f55;color:#fff;font-weight:700}
.notice{background:#f4f0df;border-left:4px solid #a08a50;padding:12px;border-radius:8px}
.result{display:none;background:#edf4ea;border-radius:12px;padding:14px;margin-top:13px}.result.error{background:#faece9}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>2026年教会退修会参加意愿申请</h1><p>10月10日（六）～10月12日（一）</p></section>

<div class="card">
<h2>关于退修会</h2>
<p>邀请弟兄姊妹暂时放下日常生活的忙碌，在敬拜、祷告、信息与团契中亲近神，也彼此建立。盼望每一位参加者都能重新得力。</p>
<div class="notice">目前先报名，暂不收款。预计9月5日确认场地费用，9月6日以后另行通知并开始收款。</div>
</div>

<form id="form">
<div class="card">
<h2>① 申请人情报</h2>
<label class="title">所属教会 <span class="required">*</span></label>
<div class="options">
<label class="option"><input type="radio" name="church" value="户田教会" required><span>户田教会</span></label>
<label class="option"><input type="radio" name="church" value="池袋教会"><span>池袋教会</span></label>
</div>
<label class="title">姓名 <span class="required">*</span></label><input type="text" name="name" required>
<label class="title">性别 <span class="required">*</span></label>
<div class="options"><label class="option"><input type="radio" name="gender" value="男" required><span>男</span></label><label class="option"><input type="radio" name="gender" value="女"><span>女</span></label></div>
<label class="title">类别 <span class="required">*</span></label>
<div class="options">
<label class="option"><input type="radio" name="category" value="成人" required><span>成人</span></label>
<label class="option"><input type="radio" name="category" value="留学生"><span>留学生 ※</span></label>
<label class="option"><input type="radio" name="category" value="小学生及学龄前儿童"><span>3岁～小学六年级</span></label>
<label class="option"><input type="radio" name="category" value="3周岁以下幼儿"><span>3岁以下幼儿</span></label>
</div>
<p>※ 仅限在日本留学生</p>
</div>

<div class="card">
<h2>② 家庭／同行者情报</h2>
<p class="small">每点击一次按钮，就增加一组姓名、性别、类别。</p>
<div id="companions"></div>
<button type="button" class="add" onclick="addCompanion()">＋ 添加同行者</button>
</div>

<div class="card">
<h2>③ 参加详细</h2>
<div id="participation"></div>
</div>

<div class="card">
<h2>④ 新朋友</h2>
<div class="options">
<label class="option"><input type="radio" name="newfriend" value="是"><span>邀请了新朋友</span></label>
<label class="option"><input type="radio" name="newfriend" value="否"><span>没有</span></label>
</div>
<label class="title">新朋友姓名</label><input type="text" name="newfriendName">
</div>

<div class="card">
<h2>⑤ 备注</h2>
<input type="text" name="note" placeholder="特殊饮食、住宿、儿童等情况">
</div>

<div class="card">
<h2>⑥ 前往退修会场地的交通方式</h2>
<p class="small">请选择您计划如何前往退修会场地。</p>
<div class="options">
<label class="option"><input type="radio" name="transport" value="自驾车" required><span>自驾车</span></label>
<label class="option"><input type="radio" name="transport" value="电车"><span>电车</span></label>
<label class="option"><input type="radio" name="transport" value="不知道，希望教会协助安排"><span>不知道，希望教会协助安排</span></label>
</div>
</div>

<div class="card">
<button class="btn" type="submit">提交报名</button>
<div id="result" class="result" aria-live="polite"></div>
</div>
</form>
</div>

<script>
/* ====== 只需要修改这里 ====== */
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUOwc93djqJi9q13h-Vk2AgqTpWhPF2uBBz0waPgqjHDqOu5onnv3YstjpyjUVH55m/exec';
/* ============================= */

let companionCount = 0;

function schedule(prefix, id) {
  return `
  <label class="title">参加日期 <span class="required">*</span></label>
  <div class="options">
  <label class="option"><input type="checkbox" name="${prefix}_days_${id}[]" value="10月10日"><span>10/10</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_days_${id}[]" value="10月11日"><span>10/11</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_days_${id}[]" value="10月12日"><span>10/12</span></label>
  </div>
  <label class="title">住宿</label>
  <div class="options">
  <label class="option"><input type="checkbox" name="${prefix}_nights_${id}[]" value="10月10日晚"><span>10/10晚</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_nights_${id}[]" value="10月11日晚"><span>10/11晚</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_nights_${id}[]" value="不住宿"><span>不住宿</span></label>
  </div>
  <label class="title">用餐</label>
  <div class="options">
  <label class="option"><input type="checkbox" name="${prefix}_meals_${id}[]" value="10/10晚餐"><span>10/10晚餐</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_meals_${id}[]" value="10/11早餐"><span>10/11早餐</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_meals_${id}[]" value="10/11午餐"><span>10/11午餐</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_meals_${id}[]" value="10/11晚餐"><span>10/11晚餐</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_meals_${id}[]" value="10/12早餐"><span>10/12早餐</span></label>
  <label class="option"><input type="checkbox" name="${prefix}_meals_${id}[]" value="10/12午餐"><span>10/12午餐</span></label>
  </div>`;
}

function addApplicant() {
  const block = document.createElement('div');
  block.className = 'people';
  block.innerHTML = '<h3>申请人</h3>' + schedule('applicant', 0);
  document.getElementById('participation').appendChild(block);
}

function addCompanion() {
  companionCount++;
  const id = companionCount;

  const companion = document.createElement('div');
  companion.className = 'people';
  companion.id = 'companion-' + id;
  companion.innerHTML = `
  <div class="people-head"><strong>同行者 ${id}</strong>
  <button type="button" class="remove" onclick="removeCompanion(${id})">删除</button></div>
  <label class="title">姓名 <span class="required">*</span></label>
  <input type="text" name="companion_name[]" required>
  <label class="title">性别 <span class="required">*</span></label>
  <div class="options">
  <label class="option"><input type="radio" name="companion_gender_${id}" value="男" required><span>男</span></label>
  <label class="option"><input type="radio" name="companion_gender_${id}" value="女"><span>女</span></label>
  </div>
  <label class="title">人员类型 <span class="required">*</span></label>
  <div class="options">
  <label class="option"><input type="radio" name="companion_type_${id}" value="成人" required><span>成人</span></label>
  <label class="option"><input type="radio" name="companion_type_${id}" value="学生"><span>留学生 ※</span></label>
  <label class="option"><input type="radio" name="companion_type_${id}" value="小学生及学龄前儿童"><span>3岁～小学六年级</span></label>
  <label class="option"><input type="radio" name="companion_type_${id}" value="3周岁以下幼儿"><span>3岁以下幼儿</span></label>
  </div>`;
  document.getElementById('companions').appendChild(companion);

  const participation = document.createElement('div');
  participation.className = 'people';
  participation.id = 'participation-' + id;
  participation.innerHTML = '<h3>同行者 ' + id + '</h3>' + schedule('companion', id);
  document.getElementById('participation').appendChild(participation);
}

function removeCompanion(id) {
  document.getElementById('companion-' + id)?.remove();
  document.getElementById('participation-' + id)?.remove();
}

function checked(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input => input.value);
}

addApplicant();

document.getElementById('form').addEventListener('submit', async function (event) {
  event.preventDefault();

  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('请粘贴')) {
    alert('请先把 Google Apps Script 的 Web App URL 填入 HTML 顶部的 GOOGLE_SCRIPT_URL。');
    return;
  }

  const formData = new FormData(this);
  const applicant = {
    name: formData.get('name'),
    gender: formData.get('gender'),
    category: formData.get('category'),
    days: checked('applicant_days_0[]'),
    nights: checked('applicant_nights_0[]'),
    meals: checked('applicant_meals_0[]')
  };

  if (!applicant.days.length) {
    alert('请选择申请人的参加日期。');
    return;
  }

  const companions = [];
  for (const block of document.querySelectorAll('#companions .people')) {
    const id = block.id.replace('companion-', '');
    const name = block.querySelector('input[name="companion_name[]"]').value.trim();
    const gender = block.querySelector(`input[name="companion_gender_${id}"]:checked`)?.value || '';
    const category = block.querySelector(`input[name="companion_type_${id}"]:checked`)?.value || '';
    const days = checked(`companion_days_${id}[]`);
    const nights = checked(`companion_nights_${id}[]`);
    const meals = checked(`companion_meals_${id}[]`);
    if (!name || !gender || !category || !days.length) {
      alert(`请完整填写同行者 ${id} 的资料。`);
      return;
    }
    companions.push({ name, gender, category, days, nights, meals });
  }

  const data = {
    church: formData.get('church'),
    familyId: '',
    applicant,
    companions,
    newfriend: formData.get('newfriend') || '',
    newfriendName: formData.get('newfriendName') || '',
    note: formData.get('note') || '',
    transport: formData.get('transport')
  };

  const result = document.getElementById('result');
  result.classList.remove('error');
  result.style.display = 'block';
  result.textContent = '正在提交报名资料……';

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    result.innerHTML = '<b>报名资料已提交！</b><br>感谢您的报名。教会同工会根据报名资料进行后续安排。';
    this.reset();
    document.getElementById('companions').innerHTML = '';
    document.getElementById('participation').innerHTML = '';
    companionCount = 0;
    addApplicant();
  } catch (error) {
    result.classList.add('error');
    result.innerHTML = '<b>提交失败</b><br>请检查网络连接，或联系教会同工。';
  }
});
</script>
</body>
</html>
